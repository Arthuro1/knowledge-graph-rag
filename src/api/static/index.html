<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knowledge Graph RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f9f9f8;
      --surface: #ffffff;
      --surface2: #f3f3f1;
      --border: rgba(0,0,0,0.1);
      --border2: rgba(0,0,0,0.18);
      --text: #1a1a18;
      --text2: #6b6b67;
      --text3: #9f9f9b;
      --accent: #1a1a18;
      --accent-fg: #ffffff;
      --info-bg: #e6f1fb;
      --info-fg: #0c447c;
      --success-bg: #eaf3de;
      --success-fg: #3b6d11;
      --purple-bg: #eeedfe;
      --purple-fg: #3c3489;
      --teal-bg: #e1f5ee;
      --teal-fg: #085041;
      --amber-bg: #faeeda;
      --amber-fg: #633806;
      --r: 8px;
      --r-lg: 12px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a18;
        --surface: #242422;
        --surface2: #2e2e2c;
        --border: rgba(255,255,255,0.1);
        --border2: rgba(255,255,255,0.18);
        --text: #f0f0ec;
        --text2: #a0a09c;
        --text3: #6b6b67;
        --accent: #f0f0ec;
        --accent-fg: #1a1a18;
        --info-bg: #042c53;
        --info-fg: #b5d4f4;
        --success-bg: #173404;
        --success-fg: #c0dd97;
        --purple-bg: #26215c;
        --purple-fg: #cecbf6;
        --teal-bg: #04342c;
        --teal-fg: #9fe1cb;
        --amber-bg: #412402;
        --amber-fg: #fac775;
      }
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: var(--surface);
      border-bottom: 0.5px solid var(--border);
      flex-shrink: 0;
    }
    .logo {
      width: 34px; height: 34px;
      border-radius: var(--r);
      background: var(--surface2);
      border: 0.5px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 17px;
    }
    .header-text h1 { font-size: 15px; font-weight: 600; }
    .header-text p { font-size: 12px; color: var(--text2); margin-top: 1px; }
    .status {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text2);
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #22c55e;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Layout */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      border-right: 0.5px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .sidebar-section { padding: 16px; border-bottom: 0.5px solid var(--border); }
    .section-label {
      font-size: 11px;
      font-weight: 500;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }

    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-card {
      background: var(--surface2);
      border-radius: var(--r);
      padding: 10px 12px;
      text-align: center;
    }
    .stat-val { font-size: 20px; font-weight: 600; }
    .stat-lbl { font-size: 11px; color: var(--text2); margin-top: 2px; }

    .entity-list { display: flex; flex-direction: column; gap: 5px; flex: 1; overflow-y: auto; }
    .entity-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px;
      border-radius: var(--r);
      cursor: pointer;
      transition: background 0.12s;
    }
    .entity-item:hover { background: var(--surface2); }
    .entity-name { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      font-size: 10px; font-weight: 500;
      padding: 2px 7px; border-radius: 99px;
      flex-shrink: 0;
    }
    .badge-concept { background: var(--purple-bg); color: var(--purple-fg); }
    .badge-technology { background: var(--teal-bg); color: var(--teal-fg); }
    .badge-topic { background: var(--amber-bg); color: var(--amber-fg); }

    .sidebar-empty { font-size: 13px; color: var(--text3); padding: 8px 0; line-height: 1.6; }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .msg { display: flex; gap: 10px; align-items: flex-start; }
    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 500;
      border: 0.5px solid var(--border);
    }
    .avatar.ai { background: var(--surface2); color: var(--text2); }
    .avatar.user { background: var(--info-bg); color: var(--info-fg); }

    .bubble {
      max-width: 72%;
      padding: 11px 15px;
      border-radius: var(--r-lg);
      font-size: 14px;
      line-height: 1.65;
      border: 0.5px solid var(--border);
    }
    .bubble.ai {
      background: var(--surface);
      border-top-left-radius: 4px;
    }
    .bubble.user {
      background: var(--surface2);
      border-top-right-radius: 4px;
    }

    .ctx-toggle {
      display: flex; align-items: center; gap: 5px;
      margin-top: 10px; padding: 5px 9px;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--r);
      font-size: 12px; color: var(--text2);
      cursor: pointer; width: 100%;
      font-family: inherit;
    }
    .ctx-toggle:hover { border-color: var(--border2); color: var(--text); }

    .ctx-box {
      margin-top: 8px;
      padding: 10px 12px;
      background: var(--bg);
      border: 0.5px solid var(--border);
      border-radius: var(--r);
      font-size: 12px;
      color: var(--text2);
      font-family: 'JetBrains Mono', monospace;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      display: none;
    }
    .ctx-box.open { display: block; }

    .typing-dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text3);
      animation: bounce 1s infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Suggestions */
    .suggestions {
      display: flex; gap: 6px; flex-wrap: wrap;
      padding: 0 28px 12px;
    }
    .suggestion {
      padding: 6px 12px;
      border-radius: 99px;
      font-size: 12px;
      background: var(--surface);
      border: 0.5px solid var(--border);
      color: var(--text2);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.12s;
    }
    .suggestion:hover { border-color: var(--border2); color: var(--text); }

    /* Input */
    .input-area {
      padding: 12px 20px 16px;
      border-top: 0.5px solid var(--border);
      background: var(--surface);
      display: flex; gap: 8px; align-items: flex-end;
    }
    .input-wrap {
      flex: 1;
      background: var(--surface2);
      border: 0.5px solid var(--border);
      border-radius: var(--r-lg);
      display: flex; align-items: flex-end;
      padding: 8px 12px;
      gap: 8px;
      transition: border-color 0.15s;
    }
    .input-wrap:focus-within { border-color: var(--border2); }
    textarea {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      resize: none;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      color: var(--text);
      line-height: 1.5;
      height: 24px;
      max-height: 120px;
    }
    textarea::placeholder { color: var(--text3); }
    .send-btn {
      width: 32px; height: 32px;
      border-radius: var(--r);
      background: var(--accent);
      color: var(--accent-fg);
      border: none;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      transition: opacity 0.15s;
    }
    .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .send-btn:not(:disabled):hover { opacity: 0.8; }
  </style>
</head>
<body>

<header class="header">
  <div class="logo">🧠</div>
  <div class="header-text">
    <h1>Knowledge Graph RAG</h1>
    <p>Neo4J · LangChain · Claude API</p>
  </div>
  <div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusLabel">Verbinde...</span>
  </div>
</header>

<div class="layout">

  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="section-label">Graph Stats</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-val" id="nodeCount">—</div>
          <div class="stat-lbl">Nodes</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="relCount">—</div>
          <div class="stat-lbl">Relations</div>
        </div>
      </div>
    </div>
    <div class="sidebar-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
      <div class="section-label">Entities</div>
      <div class="entity-list" id="entityList">
        <div class="sidebar-empty">Lade...</div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="messages" id="messages">
      <div class="msg">
        <div class="avatar ai">🤖</div>
        <div class="bubble ai">
          Hallo! Ich bin dein Knowledge Graph RAG Assistant.<br>
          Stell mir eine Frage — ich suche in deinem Neo4J-Graphen und antworte mit Kontext aus deinen Dokumenten.
        </div>
      </div>
    </div>

    <div class="suggestions" id="suggestions">
      <button class="suggestion" onclick="ask('What is RAG?')">What is RAG?</button>
      <button class="suggestion" onclick="ask('How does Neo4J relate to knowledge graphs?')">Neo4J & knowledge graphs</button>
      <button class="suggestion" onclick="ask('What is machine learning?')">What is machine learning?</button>
      <button class="suggestion" onclick="ask('What are embeddings?')">What are embeddings?</button>
    </div>

    <div class="input-area">
      <div class="input-wrap">
        <textarea
          id="input"
          placeholder="Stelle eine Frage..."
          rows="1"
          onkeydown="onKey(event)"
          oninput="autoResize(this)"
        ></textarea>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="Senden">↑</button>
    </div>
  </main>

</div>

<script>
  const API = '';  // same origin — FastAPI serves this file

  // ── Resize textarea ──────────────────────────────────────────────
  function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }

  function onKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  }

  function ask(q) {
    document.getElementById('suggestions').style.display = 'none';
    document.getElementById('input').value = q;
    sendMessage();
  }

  // ── Add message bubble ───────────────────────────────────────────
  function addMsg(role, content, graphCtx) {
    const messages = document.getElementById('messages');

    const wrap = document.createElement('div');
    wrap.className = 'msg' + (role === 'user' ? ' user' : '');

    const avatar = document.createElement('div');
    avatar.className = 'avatar ' + (role === 'user' ? 'user' : 'ai');
    avatar.textContent = role === 'user' ? '👤' : '🤖';

    const bubble = document.createElement('div');
    bubble.className = 'bubble ' + (role === 'user' ? 'user' : 'ai');

    const text = document.createElement('span');
    text.textContent = content;
    bubble.appendChild(text);

    if (graphCtx) {
      const toggle = document.createElement('button');
      toggle.className = 'ctx-toggle';
      toggle.innerHTML = '🔗 Graph-Kontext anzeigen';
      const box = document.createElement('div');
      box.className = 'ctx-box';
      box.textContent = graphCtx;
      toggle.onclick = () => {
        box.classList.toggle('open');
        toggle.innerHTML = box.classList.contains('open')
          ? '🔗 Graph-Kontext ausblenden'
          : '🔗 Graph-Kontext anzeigen';
      };
      bubble.appendChild(toggle);
      bubble.appendChild(box);
    }

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
    return text;
  }

  // ── Typing indicator ─────────────────────────────────────────────
  function addTyping() {
    const messages = document.getElementById('messages');
    const wrap = document.createElement('div');
    wrap.className = 'msg'; wrap.id = 'typing';
    wrap.innerHTML = `<div class="avatar ai">🤖</div><div class="bubble ai"><div class="typing-dots"><span></span><span></span><span></span></div></div>`;
    messages.appendChild(wrap);
    messages.scrollTop = messages.scrollHeight;
  }
  function removeTyping() {
    document.getElementById('typing')?.remove();
  }

  // ── Send message ─────────────────────────────────────────────────
  async function sendMessage() {
    const input = document.getElementById('input');
    const btn = document.getElementById('sendBtn');
    const q = input.value.trim();
    if (!q) return;

    document.getElementById('suggestions').style.display = 'none';
    input.value = '';
    input.style.height = '24px';
    btn.disabled = true;

    addMsg('user', q);
    addTyping();

    try {
      const res = await fetch(API + '/query/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: q, verbose: true })
      });

      removeTyping();

      if (!res.ok) throw new Error('HTTP ' + res.status);

      const textEl = addMsg('ai', '');
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        full += decoder.decode(value, { stream: true });
        textEl.textContent = full;
        document.getElementById('messages').scrollTop = 99999;
      }

    } catch (err) {
      removeTyping();
      addMsg('ai', '⚠️ Fehler: ' + err.message + '\n\nLäuft der Server?\n→ uvicorn src.api.app:app --reload');
    }

    btn.disabled = false;
    input.focus();
  }

  // ── Load graph data ──────────────────────────────────────────────
  async function loadGraph() {
    try {
      const [stats, entities] = await Promise.all([
        fetch(API + '/stats').then(r => r.json()),
        fetch(API + '/entities?limit=30').then(r => r.json())
      ]);

      document.getElementById('nodeCount').textContent = stats.nodes ?? '—';
      document.getElementById('relCount').textContent = stats.relationships ?? '—';

      const list = document.getElementById('entityList');
      if (!entities?.length) {
        list.innerHTML = '<div class="sidebar-empty">Noch keine Entities.<br>Starte den KG Builder.</div>';
        return;
      }

      list.innerHTML = entities.map(e => {
        const type = e.type || 'Concept';
        const badgeClass = type === 'Technology' ? 'badge-technology' : type === 'Topic' ? 'badge-topic' : 'badge-concept';
        return `<div class="entity-item" onclick="askAbout('${e.name.replace(/'/g, "\\'")}')">
          <div class="entity-name" title="${e.name}">${e.name}</div>
          <span class="badge ${badgeClass}">${type}</span>
        </div>`;
      }).join('');

    } catch {
      document.getElementById('statusDot').style.background = '#ef4444';
      document.getElementById('statusLabel').textContent = 'Offline';
      document.getElementById('entityList').innerHTML = '<div class="sidebar-empty">API nicht erreichbar.</div>';
    }
  }

  function askAbout(name) {
    document.getElementById('input').value = `Tell me about "${name}" and its relationships in the knowledge graph.`;
    document.getElementById('input').focus();
  }

  // ── Status check ─────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const res = await fetch(API + '/');
      if (res.ok) {
        document.getElementById('statusDot').style.background = '#22c55e';
        document.getElementById('statusLabel').textContent = 'API online';
      }
    } catch {
      document.getElementById('statusDot').style.background = '#ef4444';
      document.getElementById('statusLabel').textContent = 'Offline';
    }
  }

  // ── Init ──────────────────────────────────────────────────────────
  checkStatus();
  loadGraph();
  document.getElementById('input').focus();
</script>

</body>
</html>
